packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Both ship prebuilt binaries; their build scripts are unnecessary.
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
# Supply-chain: only install package versions published at least 24h ago
# (absorbs the zero-day-malware window; pnpm 11 default made explicit).
minimumReleaseAge: 1440
strictPeerDependencies: false
overrides:
  "esbuild@<0.25.0": ">=0.25.0"
  # Stack-exhaustion advisory in <8 (GHSA via mailparser→html-to-text).
  "deepmerge-ts@<8.0.0": ">=8.0.0"
  # From 1.16.12, @swc/core unpacks its native addon into a cache directory
  # on first load and refuses to load without a writable, executable one,
  # which a read-only container with a noexec /tmp lacks. next.config.ts
  # loads it through next-intl's plugin, so `next start` would die at boot.
  "@swc/core": "1.16.2"
  # Paste-handling XSS advisory in prosemirror-view <1.42.3 (GHSA-c8x8-7fp4-3x9w,
  # via @tiptap/pm and its plugins, which pnpm update leaves on the old copy).
  # prosemirror-view 1.42.5 on needs prosemirror-model ^1.25.12, and an editor
  # that loads two copies of either breaks on paste and drop.
  "prosemirror-view@<1.42.3": "^1.42.3"
  "prosemirror-model@<1.25.12": "^1.25.12"
  # Advisories fixed inside their parents' ranges, held here so that a
  # regenerated lockfile keeps the fix: markdown-it's quadratic parsing (via
  # prosemirror-markdown), undici 6's WebSocket, content-encoding and
  # EventSource denials of service (via cheerio), source-map-js's event-loop
  # denial of service (via tailwind) and zod's memory exhaustion (via the
  # MCP test client).
  "markdown-it@<14.3.3": "^14.3.3"
  "undici@<6.29.1": "^6.29.1"
  "source-map-js@<1.2.2": "^1.2.2"
  "zod@<4.6.6": "^4.6.6"
  # undici 7's content-encoding and EventSource denials of service and its
  # SRI bypass, fixed in 7.30.1: @scalar/json-magic (via fumadocs-openapi)
  # pins 7.29.1 exactly, so no parent range reaches the fix.
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
