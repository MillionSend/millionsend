[extend]
useDefault = true

[[allowlists]]
description = "Deterministic non-production keys used only by token tests"
paths = [
  '''apps/web/test/tracking-endpoints\.test\.ts''',
  '''apps/web/test/unsubscribe-page\.test\.ts''',
  '''packages/ses/test/domain-identity\.test\.ts''',
]

[[allowlists]]
description = "Deterministic fake API keys and webhook secrets for the CLI's fake Resend server, fixtures and unit tests"
paths = [
  '''packages/cli/test/commands\.test\.ts''',
  '''packages/cli/test/http\.test\.ts''',
  '''packages/cli/test/resend-source\.test\.ts''',
  '''packages/cli/test/helpers/fake-resend\.ts''',
  '''packages/cli/test/fixtures/snapshot\.json''',
  '''packages/cli/test/fixtures/resend/webhooks\.json''',
]

[[allowlists]]
description = "Static private key paired with the local SNS signature fixture"
paths = ['''packages/ses/test/fixtures/sns-test-key\.pem''']

[[allowlists]]
description = "Generated BYODKIM material passed directly to SES and never persisted"
regexTarget = "match"
regexes = ['''privateKeyB64:\s*dkim\.privateKeyB64''']
