name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  APP_IMAGE: ghcr.io/millionsend/millionsend
  BACKUP_IMAGE: ghcr.io/millionsend/backup

# A newer push supersedes a PR's run, but never an in-flight publish on main:
# cancelling one would leave the moving tags pointing at an older build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations are up to date with the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/drizzle

  # `next build` (web, and docs, whose MDX compiles nowhere else) and the
  # Dockerfiles would otherwise first run after merge, in `build`. amd64 only,
  # nothing pushed; the app image is loaded locally to boot it. Reads main's
  # layer cache but never writes one: PR-scoped entries would crowd main's out
  # of the repository's cache quota.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_USER: millionsend
          POSTGRES_PASSWORD: millionsend
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: millionsend:ci
          cache-from: type=gha,scope=app-amd64
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: scripts/backup
          outputs: type=cacheonly
          cache-from: type=gha,scope=backup-amd64
      # Runs the image as the compose files do: read-only rootfs, non-root,
      # and Docker's default tmpfs (noexec) at the same paths. A dependency
      # that writes or executes anywhere else fails here instead of on deploy.
      - name: Image boots read-only
        run: |
          docker run -d --name app --network host --init --read-only --user millionsend \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp --tmpfs /app/apps/web/.next/cache \
            --tmpfs /app/apps/docs/.next/cache --tmpfs /app/apps/docs/.source \
            -e DATABASE_URL=postgres://millionsend:millionsend@localhost:5432/millionsend \
            -e MASTER_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
            -e APP_BASE_URL=http://localhost:3000 \
            millionsend:ci
          for _ in $(seq 60); do
            curl -fs -o /dev/null localhost:3000/login && curl -fs -o /dev/null localhost:3001/health && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || break
            sleep 2
          done
          docker logs app
          exit 1

  # Whole-history secret scan with the pinned gitleaks image (the GitHub
  # action needs a license key for organization repos; the CLI does not).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1 /repo

  # The tracking edge box runs these files with nothing built from this repo,
  # so a broken Caddyfile would first show on its next restart. Caddy runs
  # through the compose service, with the box's image and env-file loading;
  # the example values resolve the {$VAR}s.
  tracking-edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/tracking-edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose run --rm caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker compose run --rm caddy caddy fmt --diff /etc/caddy/Caddyfile

  # The Helm chart must lint and render with the default values, every
  # shipped example, and the ci/ values that turn on every option (so a
  # template no example uses cannot rot unnoticed). Helm is pinned: the
  # runner image's copy changes under us.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Lint and render the chart
        run: |
          chart=deploy/helm/millionsend
          helm lint --strict "$chart"
          helm template millionsend "$chart" > /dev/null
          for values in "$chart"/examples/*.yaml "$chart"/ci/*.yaml; do
            helm lint --strict "$chart" -f "$values"
            helm template millionsend "$chart" -f "$values" > /dev/null
          done

  # Images publish only from a green check on main or a version tag, so a
  # tag a deployment tracks can never point at a build the tests rejected.
  # main → :edge (moving head); version tags → :1.2.3, :1.2 and :latest
  # (metadata-action adds :latest to semver tags by itself).
  #
  # Each platform builds on its own native runner — the Next.js build under
  # QEMU emulation was the whole cost of a multi-arch build — and pushes by
  # digest only; publish then stitches the digests into one tag per image.
  build:
    needs: [check, secrets]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels only here (they link the package to this repository); tags are
      # applied to the merged manifest in publish.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.APP_IMAGE }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: app
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.APP_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.slug }}
          cache-to: type=gha,scope=app-${{ matrix.slug }},mode=max
      # The backup sidecar (pg_dump + rclone) ships on the same tags so the
      # standalone compose file needs no build context.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: backup
        with:
          context: scripts/backup
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.BACKUP_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backup-${{ matrix.slug }}
          cache-to: type=gha,scope=backup-${{ matrix.slug }},mode=max
      - name: Export digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
        run: |
          mkdir -p /tmp/digests/app /tmp/digests/backup
          touch "/tmp/digests/app/${APP_DIGEST#sha256:}" "/tmp/digests/backup/${BACKUP_DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    # helm as well: a version tag ships the chart below, so it must lint and
    # render first; helm package alone checks neither.
    needs: [build, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: app
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: backup
        with:
          images: ${{ env.BACKUP_IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the multi-arch manifests
        env:
          APP_META: ${{ steps.app.outputs.json }}
          BACKUP_META: ${{ steps.backup.outputs.json }}
        run: |
          cd /tmp/digests/app
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$APP_META") $(printf "$APP_IMAGE@sha256:%s " *)
          cd /tmp/digests/backup
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$BACKUP_META") $(printf "$BACKUP_IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<<"$APP_META")"
      # A version tag also publishes the Helm chart, with version and
      # appVersion both the tag's, so chart 1.2.3 runs image 1.2.3. It comes
      # after the manifests: a failed image publish must never ship a chart.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          version: v3.22.1
      - name: Publish the Helm chart
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${GITHUB_REF_NAME#v}
          helm package deploy/helm/millionsend --version "$V" --app-version "$V"
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          helm push "millionsend-$V.tgz" oci://ghcr.io/millionsend/charts
