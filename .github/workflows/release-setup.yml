name: release-setup

# Publishes packages/setup (@millionsend/setup) at its current version to npm
# via Trusted Publishing (OIDC): configure npmjs.com → package
# @millionsend/setup → Settings → Trusted Publisher → GitHub Actions, repo
# MillionSend/millionsend, workflow release-setup.yml. No token stored.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The wizard's source lives in packages/ses; gate on its tests plus the
      # wrapper's own typecheck before anything reaches the registry.
      - run: pnpm --filter @millionsend/ses test
      - run: pnpm --filter @millionsend/setup typecheck
      # npm ≥ 11.5.1 exchanges the OIDC token itself; publish runs
      # prepublishOnly (esbuild bundle).
      - run: npm install -g npm@11.8.0
      - run: npm publish
        working-directory: packages/setup
