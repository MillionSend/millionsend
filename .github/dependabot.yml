version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Types must not run ahead of the node:24 runtime in the Dockerfile; bump
      # them by hand with the image.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tests must run the same Postgres major as production (postgres:17-alpine);
      # pglite 0.4+ embeds Postgres 18, which reports a different SQLSTATE for
      # RESTRICT violations and inherits the host time zone. Lift with the DB.
      - dependency-name: "@electric-sql/pglite"
        versions: [">=0.4.0"]
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Majors move by hand, with @types/node above. Ignoring them keeps
    # 24-slim the newest allowed tag, so Dependabot refreshes its pinned
    # digest: that is how a security release of the same line arrives.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /scripts/backup
    schedule:
      interval: weekly
    # As above; the Postgres major moves with the compose service and pglite.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /deploy/tracking-edge
    schedule:
      interval: weekly
