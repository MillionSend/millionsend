# EKS: AWS Load Balancer Controller ingress, RDS for Postgres, secrets from
# AWS Secrets Manager through the External Secrets Operator, and SES/SQS/SNS
# access through IRSA (no static AWS keys).
#   helm upgrade --install millionsend deploy/helm/millionsend \
#     -n millionsend --create-namespace -f deploy/helm/millionsend/examples/values-eks.yaml
#
# Not yet run on a real EKS cluster: this file renders and has been synced
# through External Secrets Operator, but IRSA, the ALB annotations and RDS
# have not been exercised end to end. Treat them as a starting point.
#
# The image tag is the chart's appVersion, a pinned release. Set image.tag
# (or image.digest) to hold another version; never a moving tag.

config:
  APP_BASE_URL: "https://mail.example.com"
  # The api has its own host below, so the dashboard and MCP tokens must
  # point there.
  PUBLIC_API_URL: "https://api.mail.example.com"
  AWS_REGION: "us-east-1"
  SNS_TOPIC_ARNS: "arn:aws:sns:us-east-1:123456789012:millionsend-events"
  SQS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/123456789012/millionsend-events"
  SES_CONFIGURATION_SET: "millionsend"
  # Credentials come from the IRSA role; this flag also enables account
  # mail (password resets, verification) without static keys.
  AWS_DEFAULT_CHAIN: "true"
  # The ALB appends the client address to X-Forwarded-For itself and
  # nothing sits in front of it, so TRUSTED_PROXIES stays unset.

# Attach the millionsend-ses policy to the role. One that predates the
# policy's reads of the events queue needs a new version, or bounces and
# complaints never reach suppression (README, "AWS credentials without
# static keys").
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/millionsend

# One Secrets Manager secret holding a JSON object with DATABASE_URL,
# MASTER_ENCRYPTION_KEY and BETTER_AUTH_SECRET (and S3_* if used). RDS for
# PostgreSQL 15+ requires TLS: give DATABASE_URL ?sslmode=require.
secrets:
  mode: externalSecret
  externalSecret:
    secretStoreRef:
      kind: ClusterSecretStore
      name: aws-secrets-manager
    dataFrom:
      - extract:
          key: millionsend/production

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200-399"
  hosts:
    - host: mail.example.com
      paths:
        # SNS delivers SES events here; the api serves it.
        - path: /ses/events
          pathType: Exact
          component: api
        - path: /
          pathType: Prefix
          component: web
    - host: api.mail.example.com
      paths:
        - path: /
          pathType: Prefix
          component: api

# One replica of web and api: their sign-in, sign-up, password-reset,
# failed-auth and MCP rate limiters are per process (N replicas allow N
# times the limits), and each replica opens about 26 Postgres connections.
# Raise them once the database and the limits allow; the budget below then
# keeps one pod of each through node drains.
web:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
api:
  replicas: 1
  service:
    type: ClusterIP
    port: 3001
    annotations:
      alb.ingress.kubernetes.io/healthcheck-path: /health
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { memory: 768Mi }
worker:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { memory: 768Mi }

# Takes effect for each component with more than one replica.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Spread each component's pods across zones. matchLabelKeys scopes the
# skew to this release and component (Kubernetes >= 1.27).
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: millionsend
    matchLabelKeys: [app.kubernetes.io/instance, app.kubernetes.io/component]
