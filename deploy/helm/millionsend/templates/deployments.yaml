{{- /*
One Deployment per process. The image's supervisor (scripts/start.mjs)
picks the process from PROCESS and runs pending migrations before starting
it (docs excepted); concurrent boots serialize on a Postgres advisory lock.
WORKER_REPLICAS and the SMTP_* keys come from the ConfigMap (see
millionsend.managedConfig); a container's own env below wins where the
listener's value differs from the one the dashboard shows.
*/ -}}
{{- $components := list
  (dict "name" "web" "port" 3000 "probe" "tcp")
  (dict "name" "api" "port" 3001 "probe" "http" "env" (dict "PORT" "3001"))
  (dict "name" "worker")
  (dict "name" "smtp" "port" (int .Values.smtp.port) "probe" "tcp" "env" (dict "SMTP_PORT" (toString .Values.smtp.port)))
  (dict "name" "docs" "port" 3002 "probe" "tcp")
}}
{{- $insecureSmtp := eq (include "millionsend.smtpInsecureAuth" .) "true" }}
{{- range $c := $components }}
{{- $v := index $.Values $c.name }}
{{- if $v.enabled }}
{{- $smtpTls := and (eq $c.name "smtp") (not (empty $v.tlsSecretName)) }}
{{- if and (eq $c.name "smtp") (not $smtpTls) (not $insecureSmtp) }}
{{- fail "smtp.enabled needs smtp.tlsSecretName (a kubernetes.io/tls Secret): the relay refuses to start without a STARTTLS keypair, unless config.SMTP_ALLOW_INSECURE_AUTH is \"true\"" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "millionsend.componentName" (dict "root" $ "suffix" $c.name) }}
  labels:
    {{- include "millionsend.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
  {{- with merge (dict) ($v.deploymentAnnotations | default dict) $.Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $v.replicas }}
  {{- if eq $c.name "worker" }}
  # Recreate: the old and new worker sets must not overlap, or N+M
  # processes each claim 1/N of the SES rate during the rollout.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "millionsend.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $c.name }}
  template:
    metadata:
      annotations:
        {{- include "millionsend.checksums" $ | nindent 8 }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "millionsend.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $c.name }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "millionsend.serviceAccountName" $ }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.automountServiceAccountToken }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      # The pause container is then PID 1 and reaps the zombie each
      # boot-time migration leaves behind (compose uses init: true).
      shareProcessNamespace: {{ $.Values.shareProcessNamespace }}
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ $c.name }}
          image: {{ include "millionsend.image" $ }}
          {{- with $.Values.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          envFrom:
            {{- if eq $c.name "docs" }}
            {{- include "millionsend.envFromConfigOnly" $ | nindent 12 }}
            {{- else }}
            {{- include "millionsend.envFrom" $ | nindent 12 }}
            {{- end }}
          env:
            - name: PROCESS
              value: {{ $c.name }}
            {{- range $k, $val := $c.env }}
            - name: {{ $k }}
              value: {{ $val | quote }}
            {{- end }}
            {{- if and (ne $c.name "docs") $.Values.aws.webIdentity.enabled }}
            {{- include "millionsend.awsWebIdentityEnv" $ | trim | nindent 12 }}
            {{- end }}
            {{- with $.Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $c.port }}
          ports:
            - name: {{ $c.name }}
              containerPort: {{ $c.port }}
              protocol: TCP
          {{- if gt (int $.Values.preStopSleepSeconds) 0 }}
          # Keeps serving while the endpoint removal reaches every
          # kube-proxy and the ingress; api and smtp exit at once on SIGTERM.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ $.Values.preStopSleepSeconds | quote }}]
          {{- end }}
          {{- $probe := dict }}
          {{- if eq $c.probe "http" }}
          {{- $probe = dict "httpGet" (dict "path" "/health" "port" $c.name) }}
          {{- else }}
          {{- $probe = dict "tcpSocket" (dict "port" $c.name) }}
          {{- end }}
          # Boot runs pending migrations first; the startup budget
          # (periodSeconds x failureThreshold) keeps a long migration from
          # being killed halfway.
          startupProbe:
            {{- toYaml $probe | nindent 12 }}
            periodSeconds: {{ $.Values.startupProbe.periodSeconds }}
            failureThreshold: {{ $.Values.startupProbe.failureThreshold }}
          readinessProbe:
            {{- toYaml $probe | nindent 12 }}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            {{- toYaml $probe | nindent 12 }}
            periodSeconds: 20
            failureThreshold: 3
          {{- end }}
          {{- with $v.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "millionsend.scratchVolumeMounts" $ | nindent 12 }}
            {{- if $smtpTls }}
            - name: smtp-tls
              mountPath: /certs
              readOnly: true
            {{- end }}
            {{- if and (ne $c.name "docs") $.Values.aws.webIdentity.enabled }}
            {{- include "millionsend.awsWebIdentityVolumeMount" $ | trim | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "millionsend.scratchVolumes" $ | nindent 8 }}
        {{- if $smtpTls }}
        - name: smtp-tls
          secret:
            secretName: {{ $v.tlsSecretName }}
        {{- end }}
        {{- if and (ne $c.name "docs") $.Values.aws.webIdentity.enabled }}
        {{- include "millionsend.awsWebIdentityVolume" $ | trim | nindent 8 }}
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
