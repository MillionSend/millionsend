{{- if eq .Values.secrets.mode "externalSecret" }}
{{- $es := .Values.secrets.externalSecret }}
{{- if not (or $es.dataFrom $es.data) }}
{{- fail "secrets.externalSecret needs dataFrom and/or data" }}
{{- end }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "millionsend.fullname" . }}
  labels:
    {{- include "millionsend.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ required "secrets.externalSecret.secretStoreRef.name is required" $es.secretStoreRef.name }}
  target:
    name: {{ include "millionsend.secretName" . }}
    creationPolicy: Owner
  {{- with $es.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $es.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
