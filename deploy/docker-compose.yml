# Standalone self-host compose file — no repo clone needed. Quickstart:
#   curl -O https://raw.githubusercontent.com/MillionSend/millionsend/main/deploy/docker-compose.yml
#   curl -o .env https://raw.githubusercontent.com/MillionSend/millionsend/main/.env.example
#   (generate the two secrets and set MILLIONSEND_IMAGE in .env, then)
#   docker compose up -d
# Production requires an explicit released version tag or, preferably, digest.
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: millionsend
      POSTGRES_PASSWORD: millionsend
      POSTGRES_DB: millionsend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U millionsend -d millionsend"]
      interval: 5s
      timeout: 5s
      retries: 10

  millionsend:
    image: "${MILLIONSEND_IMAGE:?Set MILLIONSEND_IMAGE to a released version tag or digest}"
    env_file: .env
    environment:
      PROCESS: all
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000" # web dashboard
      - "${API_BIND_ADDRESS:-127.0.0.1}:${PORT:-3001}:${PORT:-3001}" # api
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  smtp:
    image: "${MILLIONSEND_IMAGE:?Set MILLIONSEND_IMAGE to a released version tag or digest}"
    env_file: .env
    environment:
      PROCESS: smtp
    ports:
      - "${SMTP_BIND_ADDRESS:-127.0.0.1}:${SMTP_PORT:-2587}:${SMTP_PORT:-2587}" # smtp relay
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
