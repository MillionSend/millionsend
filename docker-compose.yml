services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: millionsend
      POSTGRES_PASSWORD: millionsend
      POSTGRES_DB: millionsend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U millionsend -d millionsend"]
      interval: 5s
      timeout: 5s
      retries: 10

  millionsend:
    build: .
    env_file: .env
    environment:
      PROCESS: all
    ports:
      # Host ports are .env-tunable. WEB_PORT remaps only the host side (the
      # web process is fixed at 3000 inside the container); PORT is also the
      # api's own listen port via env_file, so both sides move together.
      - "${WEB_PORT:-3000}:3000" # web dashboard
      - "${PORT:-3001}:${PORT:-3001}" # api
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  smtp:
    build: .
    env_file: .env
    environment:
      PROCESS: smtp
    ports:
      # SMTP_PORT is also the relay's listen port via env_file, so both sides
      # of the mapping move together.
      - "${SMTP_PORT:-2587}:${SMTP_PORT:-2587}" # smtp relay
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  docs:
    build: .
    env_file: .env
    environment:
      PROCESS: docs
    ports:
      # DOCS_PORT remaps only the host side (the docs process is fixed at
      # 3002 inside the container). No database dependency: the docs site is
      # static content.
      - "${DOCS_PORT:-3002}:3002" # documentation site
    restart: unless-stopped

volumes:
  pgdata:
